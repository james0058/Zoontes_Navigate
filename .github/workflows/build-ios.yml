name: Build iOS (Xcode & IPA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter & CocoaPods Dependencies
        run: |
          flutter pub get
          cd ios
          pod install --repo-update

      - name: Build iOS Runner (No Code Sign)
        run: |
          flutter build ios --no-codesign --release

      - name: Package Payload into IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -qr RideScreen-iOS.ipa Payload
          echo "IPA package created successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RideScreen-iOS-IPA
          path: build/ios/iphoneos/RideScreen-iOS.ipa
